# Mutation testing settings for gooze. Keys left out keep their defaults.
# Reference: https://gooze.dev/docs/config/
version: 1

paths:
  exclude:
    - '^example/'             # Example program, not part of the library.

run:
  mutation_timeout: 60        # Per-mutation timeout in seconds; the root package's short tests take about 20.

# Quality gates; failing one, gooze exits with code 3.
threshold:
  total: 45                   # Score of all mutants.
  average: 55                 # Average of the per-file scores.
  file: 0                     # Score every file must reach; hook/hook.go has a single mutant that survives.
  diff:                       # --diff runs, scored on the lines a change touches: every mutant must be killed.
    total: 100
    average: 100
    file: 100
